{% extends "base.html" %}

{% block title %}Profile — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">{{ user.name }}</h1>
            <p class="auth-subtitle">{{ user.email }}</p>
        </div>

        <div class="auth-card profile-card">
            <p class="profile-meta">Member since {{ user.created_at[:10] }}</p>
            <div class="profile-empty">
                Your expenses will appear here in a future step.
            </div>
        </div>

        <p class="auth-switch">
            <a href="{{ url_for('logout') }}">Sign out</a>
        </p>

    </div>
</section>

{% endblock %}
